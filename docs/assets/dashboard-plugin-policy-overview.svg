<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Prismatic Engine dashboard plugin policy overview</title>
  <desc id="desc">Illustrative screenshot-style overview of the Plugins dashboard showing policy summary, jobs, and artifacts.</desc>
  <rect width="1200" height="720" fill="#020617"/>
