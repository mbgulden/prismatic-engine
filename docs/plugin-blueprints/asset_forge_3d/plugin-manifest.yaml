schema_version: 1.1.0
name: prismatic-asset-forge-3d
version: 0.1.0
description: Prismatic asset-forge-3d plugin scaffold.
plugin_type: external-service
entry_point: asset_forge_3d.plugin:AssetForge3dPlugin
core_version_constraint: '>=0.2.0, <2.0.0'
categories:
- creative-media
- asset-forge-3d
required_capabilities:
- network
- filesystem-write
asset_domains:
- 3d-model
- mesh
- rig
- material
- texture
- scene
artifact_types:
- model/gltf-binary
- model/gltf+json
- application/x-fbx
- application/x-blender
- application/x-prismatic-asset-forge-job+json
integration_points:
- manifest
- loader
- tools
- api
- dashboard
- mcp
- asset-index
- artifact-store
- governance
automation_surfaces:
- agent-tools
- gateway-api
- dashboard
- native-cron
- mcp-server
capabilities:
- id: asset-forge-3d.generation
  label: asset-forge-3d generation and management
  category: asset-forge-3d
  tools: &id001
  - forge_3d_asset
  - retopologize_mesh
  - bake_textures
  - rig_model
  - export_3d_asset
endpoints:
- method: GET
  path: /api/plugins/asset-forge-3d/status
  description: Read plugin/service readiness.
- method: POST
  path: /api/plugins/asset-forge-3d/jobs
  description: Create an AI automation job.
- method: GET
  path: /api/plugins/asset-forge-3d/assets
  description: List generated/imported assets.
mcp_servers:
- name: asset-forge-3d-mcp
  transport: http
  command: null
  url: ${ASSET_FORGE_3D_MCP_URL}
  resources:
  - asset_forge.jobs
  - asset_forge.assets
  - asset_forge.scenes
  - asset_forge.exports
  tools: *id001
  auth_env:
  - ASSET_FORGE_3D_API_KEY
dashboard_surfaces:
- asset-forge-3d jobs
- asset-forge-3d asset library
- provider health
governance:
- secret-redacted status
- artifact provenance required
- agent jobs must emit durable asset IDs
connect_points:
- PluginLoader validates and loads this manifest.
- Gateway exposes status/job/asset endpoints.
- Agents use registered tools or MCP tools to automate jobs.
- Generated assets enter the universal asset index with provenance.
disconnect_points:
- Disconnect hides readiness/job creation without deleting assets.
- Core PE queues and unrelated plugins continue operating.
external_service:
  name: Asset Forge 3D
  kind: external-app-service
  base_url_env: ASSET_FORGE_3D_BASE_URL
  api_key_env: ASSET_FORGE_3D_API_KEY
  webhook_secret_env: ASSET_FORGE_3D_WEBHOOK_SECRET
