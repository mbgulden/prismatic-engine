schema_version: 1.1.0
name: prismatic-prismatic-images
version: 0.1.0
description: Prismatic images plugin scaffold.
plugin_type: creative-media
entry_point: prismatic_images.plugin:PrismaticImagesPlugin
core_version_constraint: '>=0.2.0, <2.0.0'
categories:
- creative-media
- images
risk_level: medium
permissions:
- network
- filesystem-write
approval_gates:
- operator approval for publish/export
policy_checks:
- credential redaction
- artifact provenance
- rate/cost limits
- destructive action approval
provenance_required: true
audit_events:
- connect
- disconnect
- job_create
- job_complete
- asset_export
job_lifecycle:
- queued
- running
- needs_approval
- completed
- failed
- cancelled
required_capabilities:
- network
- filesystem-write
asset_domains:
- image
- texture
- reference
artifact_types:
- image/png
- image/jpeg
- image/webp
- application/x-prismatic-layered-image+json
integration_points:
- manifest
- loader
- tools
- api
- dashboard
- mcp
- asset-index
- artifact-store
- governance
automation_surfaces:
- agent-tools
- gateway-api
- dashboard
- native-cron
- mcp-server
capabilities:
- id: images.generation
  label: images generation and management
  category: images
  tools: &id001
  - generate_image
  - edit_image
  - upscale_image
  - analyze_image
endpoints:
- method: GET
  path: /api/plugins/prismatic-images/status
  description: Read plugin/service readiness.
- method: POST
  path: /api/plugins/prismatic-images/jobs
  description: Create an AI automation job.
- method: GET
  path: /api/plugins/prismatic-images/assets
  description: List generated/imported assets.
mcp_servers:
- name: prismatic-images-mcp
  transport: stdio
  command: python3 -m prismatic_images.mcp_server
  url: null
  resources:
  - image.jobs
  - image.assets
  - image.references
  tools: *id001
  auth_env: []
dashboard_surfaces:
- images jobs
- images asset library
- provider health
governance:
- secret-redacted status
- artifact provenance required
- agent jobs must emit durable asset IDs
connect_points:
- PluginLoader validates and loads this manifest.
- Gateway exposes status/job/asset endpoints.
- Agents use registered tools or MCP tools to automate jobs.
- Generated assets enter the universal asset index with provenance.
disconnect_points:
- Disconnect hides readiness/job creation without deleting assets.
- Core PE queues and unrelated plugins continue operating.
external_service: null
