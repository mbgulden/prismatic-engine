schema_version: 1.1.0
name: prismatic-prismatic-music-sfx
version: 0.1.0
description: Prismatic music-sfx plugin scaffold.
plugin_type: creative-media
entry_point: prismatic_music_sfx.plugin:PrismaticMusicSfxPlugin
core_version_constraint: '>=0.2.0, <2.0.0'
categories:
- creative-media
- music-sfx
risk_level: medium
permissions:
- network
- filesystem-write
approval_gates:
- operator approval for publish/export
policy_checks:
- credential redaction
- artifact provenance
- rate/cost limits
- destructive action approval
provenance_required: true
audit_events:
- connect
- disconnect
- job_create
- job_complete
- asset_export
job_lifecycle:
- queued
- running
- needs_approval
- completed
- failed
- cancelled
required_capabilities:
- network
- filesystem-write
asset_domains:
- music
- sfx
- audio
artifact_types:
- audio/wav
- audio/mpeg
- audio/ogg
- application/x-prismatic-cue-sheet+json
integration_points:
- manifest
- loader
- tools
- api
- dashboard
- mcp
- asset-index
- artifact-store
- governance
automation_surfaces:
- agent-tools
- gateway-api
- dashboard
- native-cron
- mcp-server
capabilities:
- id: music-sfx.generation
  label: music-sfx generation and management
  category: music-sfx
  tools: &id001
  - generate_music
  - generate_sfx
  - stem_audio
  - analyze_audio
endpoints:
- method: GET
  path: /api/plugins/prismatic-music-sfx/status
  description: Read plugin/service readiness.
- method: POST
  path: /api/plugins/prismatic-music-sfx/jobs
  description: Create an AI automation job.
- method: GET
  path: /api/plugins/prismatic-music-sfx/assets
  description: List generated/imported assets.
mcp_servers:
- name: prismatic-music-sfx-mcp
  transport: stdio
  command: python3 -m prismatic_music_sfx.mcp_server
  url: null
  resources:
  - audio.jobs
  - audio.assets
  - audio.cues
  tools: *id001
  auth_env: []
dashboard_surfaces:
- music-sfx jobs
- music-sfx asset library
- provider health
governance:
- secret-redacted status
- artifact provenance required
- agent jobs must emit durable asset IDs
connect_points:
- PluginLoader validates and loads this manifest.
- Gateway exposes status/job/asset endpoints.
- Agents use registered tools or MCP tools to automate jobs.
- Generated assets enter the universal asset index with provenance.
disconnect_points:
- Disconnect hides readiness/job creation without deleting assets.
- Core PE queues and unrelated plugins continue operating.
external_service: null
