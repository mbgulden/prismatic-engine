[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prismatic-engine"
version = "0.2.0"
description = "Prismatic Engine — agent orchestration hub powered by Linear labels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
keywords = ["linear", "agent", "orchestration", "pipeline", "automation"]

authors = [
    {name = "Michael Gulden", email = "Michael@growthwebdev.com"},
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "croniter>=2.0.0,<6",
    "cryptography>=41.0.0,<50",
    "jsonschema>=4.18.0,<5",
    "packaging>=23.0",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "swarmlock @ git+https://github.com/mbgulden/swarmlock.git@392b858ecfb2fca416426adadece933938584994",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
http = ["requests>=2.31"]
redis = ["redis>=5.0"]
gateway = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27", "websockets>=12.0"]
primitives = [
    "swarmlock @ git+https://github.com/mbgulden/swarmlock.git@392b858ecfb2fca416426adadece933938584994",
    "swarmcron @ git+https://github.com/mbgulden/swarmcron.git@5d1a1b6fe1da618f1d9545fdd82ccf994a08688f",
    "swarmrouter @ git+https://github.com/mbgulden/swarmrouter.git@70cd54cfa9196c70352f08280c5b185039bdad52",
    "swarmcurator @ git+https://github.com/mbgulden/swarmcurator.git@786b180697dae12be733f381ac09c3e51b560afb",
    "swarmgate @ git+https://github.com/mbgulden/swarmgate.git@31eac03693b9fafdd872e33b53da98d677ead4c8",
    "swarmledger @ git+https://github.com/mbgulden/swarmledger.git@0794e2fbf11c5b2b082c0c84cff7f90a7a6ed4b6",
    "swarmsaga @ git+https://github.com/mbgulden/swarmsaga.git@54f9b94f6d257920ddf81f936ccd7318c917c3b8",
]
verification = [
    "swarmproof @ git+https://github.com/mbgulden/swarmproof.git@eb3242e7f867227c88efb2e1f64c08550df72e8b",
]
mesh = [
    "swarmmesh @ git+https://github.com/mbgulden/swarmmesh.git@b0ff422b63068f6bb4011bee688a2ad247431718",
    "swarmmemory @ git+https://github.com/mbgulden/swarmmemory.git@9a5debb0be4b942da8868fa71991b6d985cd51cf",
    "swarmcas @ git+https://github.com/mbgulden/swarmcas.git@1c00979e6980b7d7c13669d05f0cc3db2837710e",
]
robustness = [
    "swarmsandbox @ git+https://github.com/mbgulden/swarmsandbox.git@d6f65177365245e2af18e5c5693a2e57a98c6305",
    "swarmmerge @ git+https://github.com/mbgulden/swarmmerge.git@9fcdecdba101dd2212cbcaadb7158e70d381247d",
    "swarmmeter @ git+https://github.com/mbgulden/swarmmeter.git@0cdc889244222256a30e04e1a77843a7828827d0",
]
security = [
    "swarmvault @ git+https://github.com/mbgulden/swarmvault.git@f8806c5576ce95de0c92187b515b67734f8c2aee",
]
consensus = [
    "swarmconsensus @ git+https://github.com/mbgulden/swarmconsensus.git@a445f0dcf5475e7032f357b7fb3cb5c2636be3fa",
]
antigravity = ["google-antigravity>=0.1.0"]
dev = ["build>=1.0", "pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.1", "ruff>=0.5,<0.16", "twine>=5.0"]
all = ["prismatic-engine[http,redis,gateway,primitives,verification,mesh,robustness,security,consensus]"]
release = ["prismatic-engine[all,dev]"]

[project.urls]
Homepage = "https://github.com/mbgulden/prismatic-engine"
Documentation = "https://github.com/mbgulden/prismatic-engine"

[project.scripts]
prismatic = "prismatic.cli:main"
plugin-load-gate = "prismatic.quality.plugin_load:main"
prismatic-engine = "prismatic.dispatcher:main"
prismatic-engine-skills = "prismatic.skills:cli_skills"
prismatic-lock = "prismatic.lock:main"
prismatic-admin = "prismatic.admin:main"
prismatic-journal = "prismatic.journal:cli_journal"
prismatic-journal-snapshot = "prismatic.journal:cli_journal_snapshot"
prismatic-linear-import = "prismatic.journal:cli_linear_import"
prismatic-second-witness = "prismatic.journal:cli_second_witness"
prismatic-gateway = "prismatic.gateway.server:main"
prismatic-api = "prismatic.api.server:run"

[tool.setuptools.packages.find]
include = ["prismatic*", "pe*"]
exclude = ["prismatic*.tests*", "*tests*"]

[tool.setuptools.package-data]
prismatic = [
    "skills/**/*",
    "templates/**/*",
    "config/**/*",
    "schemas/**/*",
    "resources/**/*",
    "cron_receipts/*.json",
    "harnesses/*.json",
    "gateway/templates/**/*",
    "gateway/dashboard_src/**/*",
    "gateway/static/**/*",
    "shipped_plugins/**/*",
]
pe = [
    "**/*",
]

[tool.setuptools.exclude-package-data]
prismatic = [
    "**/__pycache__/*",
    "**/__pycache__/**/*",
    "**/tests/*",
    "**/tests/**/*",
    "shipped_plugins/**/tests/*",
    "shipped_plugins/**/tests/**/*",
    "*.pyc",
    "*.pyo",
]

# ─────────────────────────────────────────────────────────────────────
# Plugin entry points (Gap 9 / Part B)
# ─────────────────────────────────────────────────────────────────────
# Third-party plugins register themselves under the "prismatic.plugins"
# group. Prismatic Engine queries this group at startup via
# importlib.metadata.entry_points(group="prismatic.plugins") to discover
# installed plugins. See prismatic/review/registry.py for the registry
# API plugins use to contribute patterns, checks, and impact rules.
#
# Example plugin pyproject.toml:
#   [project.entry-points."prismatic.plugins"]
#   my_check_plugin = "my_check_pkg:register"
#
# Example plugin entry point:
#   def register(registry: ReviewerRegistry) -> None:
#       registry.register_check(my_custom_check, name="my_check")

[project.entry-points."prismatic.plugins"]
# No built-in plugins ship with Prismatic Engine itself.
# Add entries here only when integrating an internal plugin that lives
# in the main repo (e.g. a security-policy plugin). External plugins
# declare their own entry points in their own pyproject.toml.

[tool.pytest.ini_options]
pythonpath = [".", "prismatic/shipped_plugins", "prismatic/shipped_plugins/pwp"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = [
    "live: live-environment assertions; skipped unless PRISMATIC_RUN_LIVE_TESTS=1",
]
