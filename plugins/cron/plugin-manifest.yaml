# prismatic-cron — cron capability plugin manifest
#
# First consumer of the generic plugin lifecycle (on_suspend / on_resume).
# Disabled by default (auto_enable: false): the operator must explicitly
# enable it after attaching. Scheduling is infrastructure, not an agent tool.

schema_version: "1.0.0"

name: "prismatic-cron"

version: "0.1.0"

description: >-
  Cron capability plugin for the Prismatic Engine generic plugin lifecycle.
  Fires configured jobs on 5-field cron schedules with script, prompt, and
  webhook handlers; records per-run receipts with idempotency keys under
  $PRISMATIC_HOME/plugin-state/prismatic-cron/. Infrastructure only —
  registers no agent tools.

author: "Prismatic Engine Swarm"

license: "MIT"

# Fully qualified Python class path acting as the entry point.
# Module path uses UNDERSCORES (dir name matches first module segment);
# the plugin `name` (dashed) is what humans read.
entry_point: "cron.plugin:CronPlugin"

core_version_constraint: ">=0.2.0, <2.0.0"

dependencies:
  pip:
    - "swarmcron>=0.3.0"

# Plugin registers but starts DISABLED. The operator enables it explicitly
# after attach; on enable the loader calls on_init() with the validated config.
auto_enable: false

permissions:
  - "subprocess"
  - "filesystem-write"
  - "network"

risk_level: "medium"

policy_checks:
  - "script commands validated via swarmcron.security.validate_task_command"
  - "environment sanitized via swarmcron.security.sanitize_env"
  - "secret redaction on captured handler output"

audit_events:
  - "job_fired"
  - "job_succeeded"
  - "job_failed"
  - "job_skipped_policy"
  - "prompt_dispatched"
  - "suspend"
  - "resume"

endpoints:
  - method: "GET"
    path: "/api/cron/jobs"
    description: "List cron jobs with schedule, enabled flag, next fire time, and last run status."

tags:
  - "infrastructure"
  - "optional"

# JSON Schema for the plugin config. Validated by the PluginLoader at attach
# time; CronPlugin.on_init() re-validates defensively and raises
# PluginValidationError on any violation.
#
# The job definition fields intentionally cover what the harness profile's
# cron/jobs.json expresses (name, schedule, script/prompt, enabled, deliver),
# so journal cron jobs COULD migrate here later. No migration is performed
# by this plugin — see to_schedule_record() for the documented mapping path.
config_schema:
  type: "object"
  additionalProperties: false
  properties:
    jobs:
      type: "array"
      items:
        type: "object"
        additionalProperties: false
        required: ["name", "schedule", "handler"]
        properties:
          name:
            type: "string"
            minLength: 1
            description: "Unique job name."
          schedule:
            type: "string"
            pattern: "^(\\S+\\s+){4}\\S+$"
            description: "5-field cron expression (minute hour dom month dow)."
          handler:
            type: "object"
            additionalProperties: false
            required: ["kind", "ref"]
            properties:
              kind:
                type: "string"
                enum: ["script", "prompt", "webhook"]
                description: >-
                  script: run ref as a shell command via subprocess.
                  prompt: record a prompt-dispatched receipt; the harness/agent
                  layer picks the prompt up (the plugin never calls LLMs).
                  webhook: POST a JSON payload to the ref URL.
              ref:
                type: "string"
                minLength: 1
                description: "Command string, prompt reference, or webhook URL."
          enabled:
            type: "boolean"
            default: true
            description: "Disabled jobs never fire."
          deliver:
            type: "object"
            description: "Optional delivery routing for job results."
            properties:
              channel:
                type: "string"
                description: "Delivery channel (e.g. email, webhook, dashboard)."
              target:
                type: "string"
                description: "Channel-specific target (address, URL, topic)."
          metadata:
            type: "object"
            description: "Free-form operator metadata."
          policy:
            type: "object"
            additionalProperties: false
            properties:
              max_runs_per_day:
                type: "integer"
                minimum: 1
                description: "Cap successful+failed executions per calendar day (UTC)."
    script_timeout_sec:
      type: "integer"
      minimum: 1
      default: 120
      description: "Subprocess timeout for script handlers."
  required: []
