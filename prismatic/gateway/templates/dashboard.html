<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prismatic Hub Dashboard</title>
    <link href="/static/dashboard.css?v=ac5fca5b5040" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { max-width: 100vw; overflow-x: hidden; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #080b11;
            transition: background-color 0.3s, color 0.3s;
        }
        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', sans-serif;
        }
        .glass-panel {
            background: rgba(13, 17, 28, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .status-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(1.1); }
        }
        .agent-node {
            transition: transform 0.2s, filter 0.2s;
            cursor: pointer;
        }
        .agent-node:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
        
        /* Light Mode Styles */
        body.light-mode {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }
        body.light-mode .text-slate-200 { color: #1e293b; }
        body.light-mode .text-slate-300 { color: #334155; }
        body.light-mode .text-slate-400 { color: #475569; }
        body.light-mode .text-slate-500 { color: #64748b; }
        body.light-mode header {
            background-color: rgba(255, 255, 255, 0.85);
            border-color: #e2e8f0;
        }
        body.light-mode footer {
            border-color: #e2e8f0;
            background-color: rgba(241, 245, 249, 0.5);
        }
        body.light-mode tr.border-b {
            border-color: #e2e8f0;
        }
        body.light-mode tr:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }
        body.light-mode input, body.light-mode select {
            background-color: rgba(255, 255, 255, 0.9) !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.light-mode pre {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
            color: #334155 !important;
        }
        body.light-mode .border-slate-800 { border-color: #e2e8f0; }
        body.light-mode .border-slate-900 { border-color: #f1f5f9; }
        body.light-mode .bg-slate-950 { background-color: #f1f5f9; }
        body.light-mode .bg-slate-900\/50 { background-color: rgba(255, 255, 255, 0.8); }
        body.light-mode .bg-slate-950\/20 { background-color: rgba(241, 245, 249, 0.3); }
        body.light-mode .bg-indigo-500\/5 { background-color: rgba(99, 102, 241, 0.05); }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col max-w-full overflow-x-hidden">
    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-40 min-w-0 max-w-full overflow-hidden" data-proof-marker="dashboard-header-mobile-wrap">
        <div class="flex items-center space-x-3 min-w-0">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-cyan-500/20">
                ⧉
            </div>
            <div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent leading-none">PRISMATIC HUB</h1>
                <span class="text-xs text-slate-500 font-medium">Observe · Orchestrate · Produce</span>
            </div>
        </div>
        
        <div class="flex flex-wrap items-center justify-end gap-2 sm:gap-4 min-w-0">
            <!-- Mode Switcher -->
            <div class="bg-slate-950 border border-slate-800/80 px-1 py-1 rounded-lg flex space-x-1">
                <span class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider bg-indigo-600 text-white rounded">Standalone</span>
                <span class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-500">Native</span>
            </div>
            <!-- Theme Toggle -->
            <button onclick="toggleTheme()" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/50 p-2 rounded-full transition flex items-center justify-center min-w-[36px] min-h-[36px]" aria-label="Toggle Theme">
                <svg id="theme-icon" class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path>
                </svg>
            </button>
            <!-- WS Status -->
            <div class="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/50 max-w-full">
                <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-red-500 status-pulse"></span>
                <span id="status-text" class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">Connecting</span>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs Bar -->

                Ingestion Queue

            <button id="tab-btn-merge" onclick="switchTab('merge')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider border transition-all duration-200 bg-transparent text-slate-400 border-transparent hover:bg-slate-800/50 hover:text-slate-200">
                Merge Pipeline
            </button>
            <button id="tab-btn-foundation" onclick="switchTab('foundation')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider border transition-all duration-200 bg-transparent text-slate-400 border-transparent hover:bg-slate-800/50 hover:text-slate-200">
                Foundation
            </button>
            <button id="tab-btn-workspaces" onclick="switchTab('workspaces')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider border transition-all duration-200 bg-transparent text-slate-400 border-transparent hover:bg-slate-800/50 hover:text-slate-200">
                Workspaces
            </button>
            <button id="tab-btn-skills" onclick="switchTab('skills')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider border transition-all duration-200 bg-transparent text-slate-400 border-transparent hover:bg-slate-800/50 hover:text-slate-200">
                Skills
            </button>
            <button id="tab-btn-signals" onclick="switchTab('signals')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider border transition-all duration-200 bg-transparent text-slate-400 border-transparent hover:bg-slate-800/50 hover:text-slate-200">

            </button>
            <button id="tab-btn-crons" onclick="switchTab('crons')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider border transition-all duration-200 bg-transparent text-slate-400 border-transparent hover:bg-slate-800/50 hover:text-slate-200">

            <button id="tab-btn-pwp" onclick="switchTab('pwp')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider border transition-all duration-200 bg-transparent text-slate-400 border-transparent hover:bg-slate-800/50 hover:text-slate-200">
                PWP Plugin
            </button>
            <button id="tab-btn-plugins" onclick="switchTab('plugins')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider border transition-all duration-200 bg-transparent text-slate-400 border-transparent hover:bg-slate-800/50 hover:text-slate-200">
                Plugins
            </button>
            <button id="tab-btn-quota" onclick="switchTab('quota')" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider border transition-all duration-200 bg-transparent text-slate-400 border-transparent hover:bg-slate-800/50 hover:text-slate-200">
                Resources
            </button>
