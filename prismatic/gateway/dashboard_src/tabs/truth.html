<!-- Truth Panels Dashboard Tab — read-only "what is actually live" snapshot -->
<div id="section-truth" class="hidden space-y-6 max-w-full overflow-x-hidden">
  <div class="flex items-center justify-between border-b border-gray-700 pb-4">
    <div>
      <h2 class="text-2xl font-bold text-white flex items-center gap-2">
        <span>🔎</span> Truth Panels
      </h2>
      <p class="text-sm text-gray-400">Read-only snapshot of what is actually live on production. Auto-refreshes while this tab is open.</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="truth-status-line" class="text-xs text-gray-500">Not loaded</span>
      <button onclick="loadTruthPanels()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 rounded-lg text-sm font-medium transition">
        Refresh
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
    <!-- Trust ledger -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
      <div class="flex items-center justify-between">
        <div class="text-xs font-semibold text-gray-400 uppercase">Trust Ledger</div>
        <span id="truth-trust-dot" class="inline-block w-3 h-3 rounded-full bg-gray-600" title="panel status"></span>
      </div>
      <div id="truth-trust-ledger" class="text-sm font-mono text-white mt-2">Loading...</div>
      <div id="truth-trust-detail" class="text-xs text-gray-500 mt-1 font-mono whitespace-pre-line"></div>
    </div>

    <!-- T1 status (read-only display only) -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
      <div class="flex items-center justify-between">
        <div class="text-xs font-semibold text-gray-400 uppercase">T1 Autonomy <span class="text-[10px] text-gray-500 font-normal">· read-only</span></div>
        <span id="truth-t1-dot" class="inline-block w-3 h-3 rounded-full bg-gray-600" title="panel status"></span>
      </div>
      <div id="truth-t1-status" class="text-sm font-mono text-white mt-2">Loading...</div>
      <div id="truth-t1-reason" class="text-xs text-gray-500 mt-1 font-mono"></div>
    </div>

    <!-- Deployed SHA -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
      <div class="flex items-center justify-between">
        <div class="text-xs font-semibold text-gray-400 uppercase">Deployed SHA</div>
        <span id="truth-sha-dot" class="inline-block w-3 h-3 rounded-full bg-gray-600" title="panel status"></span>
      </div>
      <div id="truth-deployed-sha" class="text-sm font-mono text-indigo-400 mt-2 truncate">Loading...</div>
      <div id="truth-sha-detail" class="text-xs text-gray-500 mt-1 font-mono"></div>
    </div>

    <!-- Merge-receipt coverage -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
      <div class="flex items-center justify-between">
        <div class="text-xs font-semibold text-gray-400 uppercase">Merge-Receipt Coverage</div>
        <span id="truth-receipts-dot" class="inline-block w-3 h-3 rounded-full bg-gray-600" title="panel status"></span>
      </div>
      <div id="truth-receipt-coverage" class="text-sm font-mono text-white mt-2">Loading...</div>
      <div id="truth-receipts-detail" class="text-xs text-gray-500 mt-1 font-mono whitespace-pre-line"></div>
    </div>

    <!-- Consumer lag -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
      <div class="flex items-center justify-between">
        <div class="text-xs font-semibold text-gray-400 uppercase">Consumer Lag</div>
        <span id="truth-lag-dot" class="inline-block w-3 h-3 rounded-full bg-gray-600" title="panel status"></span>
      </div>
      <div id="truth-consumer-lag" class="text-sm font-mono text-white mt-2">Loading...</div>
      <div id="truth-lag-detail" class="text-xs text-gray-500 mt-1 font-mono whitespace-pre-line"></div>
    </div>
  </div>
</div>
