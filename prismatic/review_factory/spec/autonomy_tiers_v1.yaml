# Earned-autonomy tier policy — frozen tier definitions (Phase 2).
#
# Versioned: never edit in place to change behavior — add a new versioned
# file and point the loader at it. The shipped copy is a definition, not
# a switch: nothing in the factory reads this file yet (wiring is Phase 3).
#
# Status: proposed. `enabled: false` is the fail-closed default — the
# autonomy engine treats "no policy" and "policy disabled" identically:
# Tier 0 behavior (PRs only, Michael merges) for everything.
#
# Tier model (earned autonomy, approved by Michael):
#   T0 — active today: PRs only, Michael merges. No auto-merge, ever.
#   T1 — docs/chore/dep_bump; auto-merge behind the brake; graduates on
#        20 consecutive clean of the tier's classes + 0.80 pause precision.
#   T2 — adds agent_standard; auto-merge behind the brake; graduates on
#        30 consecutive clean + 0.85 pause precision.
#   T3 — DEFINED BUT UNBUILT by Michael's decision. Listed here for
#        completeness; the policy engine refuses tier 3 before the class
#        table is ever consulted. auto_merge stays false. The 50-clean /
#        0.85-precision graduation target is the frozen bar for the day T3
#        is built, not an active promotion path.
#
# Graduation counting (frozen, documented for override): clean streaks are
# a UNION streak across the tier's qualifying classes — consecutive clean
# merges summed over the tier's change classes (see phase-1 trust ledger
# spec for the exact counting rule).
#
# The brake is twofold: the environment variable below AND a dashboard
# switch. Either one pulled refuses every auto-merge (fail-closed).

version: autonomy-v1
enabled: false

tiers:
  0:
    label: manual-only
    classes: []
    auto_merge: false
    notes: "Active today. PRs only; Michael merges."
  1:
    label: docs-chore-deps
    classes: [docs, chore, dep_bump]
    auto_merge: true   # behind the brake (env var + dashboard switch)
    graduation:
      consecutive_clean: 20
      pause_precision_floor: 0.80
  2:
    label: agent-standard
    classes: [docs, chore, dep_bump, agent_standard]
    auto_merge: true   # behind the brake (env var + dashboard switch)
    graduation:
      consecutive_clean: 30
      pause_precision_floor: 0.85
  3:
    label: unbuilt
    classes: [docs, chore, dep_bump, agent_standard]
    auto_merge: false  # UNBUILT by Michael's decision — never activates
    graduation:
      consecutive_clean: 50
      pause_precision_floor: 0.85
    excluded_classes:
      - production_deploys
      - auth_security_paths
      - jev_paused
      - calibration_required_human

revocation:
  triggers: [rollback_in_30d, precision_collapse]
  rollback_in_30d:
    condition: "rollback_count_30d > 0"
    action: "propose demotion to the prior tier (Michael's call)"
  precision_collapse:
    condition: "pause_precision < 0.50 with pauses_trailing_30 >= 20"
    action: "propose demotion to the prior tier (Michael's call)"
  notes: "Revocation is advisory. The mechanical revoke lives in the
    phase-1 trust ledger; promotion and demotion stay Michael's explicit
    decisions."

brake:
  env_var: PRISMATIC_AUTONOMY_ENABLED
  engaged_values: ["0", "false", "no"]  # case-insensitive; unset = not engaged
  dashboard_switch: true
  notes: "Either the env var or the dashboard switch pulled refuses every
    auto-merge. Default (unset): brake not engaged, T0 still refuses."

zero_ai:
  rule: docs_only_clean
  notes: "Zero-AI runs are conservative by design: only docs changes with
    a CLEAN deterministic verdict may auto-merge (note zero_ai_docs_only).
    Everything else refuses zero_ai_conservative."
