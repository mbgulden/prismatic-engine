# Attention routing (shadow mode) — Jev #29, Chunk 6.
#
# Risk-scores every PR so review time goes to the dangerous ones first.
#
# SHADOW ONLY / ADVISORY ONLY: this workflow renders an advisory report,
# uploads it as an artifact, and posts it as a clearly-marked advisory PR
# comment. It creates no status checks, holds no merge, approves or denies
# nothing, and never gates anything.

name: Attention routing (shadow)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to score"
        required: true

permissions: {}

jobs:
  score:
    name: Score PR risk (shadow, advisory only)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # advisory comment only; least privilege otherwise
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Score PR (shadow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/attention_routing_shadow.py \
            --pr "${{ github.event.pull_request.number || inputs.pr_number }}" \
            --out attention-report.md

      - name: Upload advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attention-report-${{ github.event.pull_request.number || inputs.pr_number }}
          path: attention-report.md
          if-no-files-found: warn

      - name: Post advisory comment
        # Drafts are scored but the comment is withheld until ready.
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- attention-routing-shadow -->';
            const body = fs.readFileSync('attention-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Update our previous advisory comment instead of spamming new ones.
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const prior = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: prior.id, body,
              });
              core.info(`Updated advisory comment ${prior.id} (shadow, non-blocking).`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Posted advisory comment (shadow, non-blocking).');
            }
