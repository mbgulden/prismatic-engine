name: Post-Merge Production Deploy Hook (WB-1)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run deploy mode'
        required: true
        type: boolean
        default: true

jobs:
  post-merge-deploy:
    # Self-hosted webtop-hermes runner (free minutes; GitHub-hosted
    # minutes are blocked by the account billing state).
    # NOTE: on the runner, the curl below reaches localhost:9460 on
    # webtop-hermes, where the real deploy receiver (pe.deploy.receiver)
    # listens -- a correctly-signed POST triggers the actual post-merge
    # deploy pipeline. On GitHub-hosted runners this was a silent
    # no-op because nothing listened on the runner's localhost.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Calculate Payload & HMAC Signature
        id: payload
        env:
          HMAC_SECRET: ${{ secrets.DEPLOY_HMAC_SECRET }}
        run: |
          if [ -z "$HMAC_SECRET" ]; then
            echo "::error::DEPLOY_HMAC_SECRET repository secret is missing!"
            exit 1
          fi

          PR_SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Construct JSON payload. The repository field (owner/repo) is what
          # the deploy receiver routes on (WS1 multi-repo); it must always be
          # present -- the receiver fail-closes without it.
          PAYLOAD_JSON=$(jq -c -n \
            --arg sha "$PR_SHA" \
            --arg title "$COMMIT_MSG" \
            --arg deployer "${{ github.actor }}" \
            --arg time "$TIMESTAMP" \
            --arg repo "${{ github.repository }}" \
            '{pr_sha: $sha, pr_title: $title, deployer: $deployer, merged_at: $time, repository: $repo}')
            
          HMAC_SIG=$(echo -n "$PAYLOAD_JSON" | openssl dgst -sha256 -hmac "$HMAC_SECRET" | sed 's/^.*= //')
          
          echo "payload=$PAYLOAD_JSON" >> $GITHUB_OUTPUT
          echo "sig=$HMAC_SIG" >> $GITHUB_OUTPUT

      - name: Dry-run — deploy trigger skipped
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          echo "DRY RUN: deploy trigger was NOT sent to the deploy receiver."
          echo "The payload above was computed and HMAC-signed to validate the signing path."
          echo "Re-run this workflow with dry_run=false to perform a real deploy."

      - name: Send Post-Merge Deploy Trigger to Receiver
        # The dry_run workflow_dispatch input is a real gate: push events always
        # deploy; manual dispatches deploy only when dry_run is explicitly false.
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          PAYLOAD_JSON: ${{ steps.payload.outputs.payload }}
          HMAC_SIG: ${{ steps.payload.outputs.sig }}
          RECEIVER_HOST: ${{ secrets.DEPLOY_RECEIVER_HOST }}
        run: |
          HOST="${RECEIVER_HOST:-localhost}"
          echo "Triggering deploy receiver at http://${HOST}:9460/deploy"
          # The receiver answers 2xx only when the deploy (including the real
          # gateway redeploy + rollback-on-failure) actually succeeded. Any
          # failure must turn this run RED -- never swallow it into green.
          if ! curl -s -f -X POST \
            -H "X-Hub-Signature-256: sha256=${HMAC_SIG}" \
            -H "Content-Type: application/json" \
            --data "${PAYLOAD_JSON}" \
            "http://${HOST}:9460/deploy"; then
            echo "::error::Deploy receiver call failed -- the gateway was NOT redeployed. Check the receiver log at ~/.prismatic/logs/deploy-receiver.log"
            exit 1
          fi

