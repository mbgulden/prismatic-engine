name: Shadow Event Feed (Phase 0)

# Event-driven shadow observer: GitHub tells us when a PR changes instead of
# the 15-minute timer asking. The VM has no public ingress, so inbound
# webhooks are impossible — pull_request events on the existing self-hosted
# runner are the event source.
#
# Observe-only: runs the shadow observer per PR and appends one audit signal
# per new (pr, head_sha) to ~/.prismatic/audit/shadow-decisions.jsonl.
# Read-only gh calls; a PR that can't be read or has unsettled CI is
# deferred (logged, exit 0), never crashes the run. Nothing here merges,
# edits, or notifies about anything.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # CI-settled re-trigger: pull_request events fire when CI *starts*, when the
  # observer can only defer; when the "test" workflow finishes, re-evaluate
  # every PR it ran for. Idempotency comes from the shared seen-state file
  # (~/.prismatic/state/shadow-seen.json), already used by the poller.
  workflow_run:
    workflows: ["test"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read

# One in-flight shadow evaluation per PR; a newer event supersedes an older one.
# workflow_run payloads carry PRs under workflow_run.pull_requests instead.
concurrency:
  group: >-
    shadow-event-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shadow-call:
    # Self-hosted webtop-hermes runner (free minutes; GitHub-hosted
    # minutes are blocked by the account billing state).
    # Skip no-op runs: a "test" completion for a push carries no PRs, so
    # there is nothing to observe. Skipped jobs never take a runner.
    if: ${{ github.event_name == 'pull_request' || toJSON(github.event.workflow_run.pull_requests) != '[]' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout observer code
        uses: actions/checkout@v4

      - name: Run shadow observer for this PR
        env:
          # gh CLI authenticates via GH_TOKEN; no dependence on the
          # runner user's stored gh credentials.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Handle both event shapes: pull_request (one PR) and workflow_run
          # (every PR the completed "test" run covered; empty for push runs).
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            PRS=$(echo '${{ toJson(github.event.workflow_run.pull_requests) }}' | jq -r '.[].number')
          else
            PRS="${{ github.event.pull_request.number }}"
          fi
          for PR in $PRS; do
            /home/ubuntu/.prismatic/venv_current/bin/python \
              prismatic/review_factory/shadow_event.py \
              --pr-number "$PR" \
              --event "${{ github.event.action }}"
          done
