name: test

# PR gate: fast smoke (~2 min) + the review factory verifier, both on
# the self-hosted webtop-hermes runner (free minutes; GitHub-hosted
# minutes are blocked by the account billing state).
#
# What changed (Sep 2026): the old 8-job matrix (4 Python versions x 2 shards,
# up to 70 min/run, fired on both push AND pull_request) burned ~1,840 of
# 2,000 monthly minutes. The full unit suite now runs nightly on the
# self-hosted runner instead (nightly-full-suite.yml); PRs get the focused
# review-factory gate plus a ruff smoke check.
#
# DO NOT re-add push+pull_request double triggers or the version matrix here
# without checking the Actions minute budget first.

on:
  pull_request:
    branches:
      - main
      - deploy-fresh
  push:
    branches:
      - main
      - deploy-fresh

# A new push kills the stale run instead of billing both.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (ruff lint)
    # Self-hosted webtop-hermes runner (free minutes).
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned: the repo is clean under 0.15.20; unpinned installs drift
        # (0.16.x flags 114 pre-existing findings) and break the gate.
        run: python -m pip install "ruff==0.15.20"

      - name: Run lint
        run: |
          python -m ruff check \
            prismatic/__init__.py \
            prismatic/review_factory/ \
            scripts/release_check.py \
            scripts/release_smoke.py \
            scripts/pr_contract_lint.py \
            scripts/public_launch_smoke.py \
            scripts/public_security_readiness_audit.py \
            scripts/dashboard_visual_qa.py \
            tests/test_plugin_load_gate.py \
            tests/test_pr_contract_lint.py \
            tests/test_public_security_readiness.py \
            tests/test_dashboard_ux_hardening.py \
            prismatic/quality/test_smoke.py
          python -m ruff format --check \
            prismatic/__init__.py \
            prismatic/review_factory/ \
            scripts/release_check.py \
            scripts/release_smoke.py \
            scripts/pr_contract_lint.py \
            scripts/public_launch_smoke.py \
            scripts/public_security_readiness_audit.py \
            scripts/dashboard_visual_qa.py \
            tests/test_plugin_load_gate.py \
            tests/test_pr_contract_lint.py \
            tests/test_public_security_readiness.py \
            tests/test_dashboard_ux_hardening.py \
            prismatic/quality/test_smoke.py

  contract-lint:
    name: "PR contract lint (structure only)"
    # WS3: every PR body must carry the contract sections (what changed /
    # proof / negative paths / risk & rollback / local verification
    # attestation). Mechanical structure check only — never judges quality.
    # The `contract-waiver` label + a `## Waiver reason` section is the
    # audited escape hatch (waiver use is surfaced in the autonomy digest).
    # pull_request-only: push events have no PR body to check.
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint PR body against the contract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: printf '%s' "$PR_BODY" | python3 scripts/pr_contract_lint.py - --labels "$PR_LABELS"

  triage-unit-tests:
    name: "triage unit tests (failure classifier + retry executor)"
    # 2026-09-28: prismatic/review_factory/tests/ was never executed in CI
    # (testpaths=["tests"] and no workflow ran it), so the retry executor's
    # own tests shipped un-gated -- including 3 tests red on main since #496.
    # This job runs them. Blocking: the active-retry safety logic must stay
    # green. Self-hosted webtop-hermes runner (free minutes).
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pyyaml pytest

      - name: Run triage unit tests
        # Scoped to the triage files (not the whole tests/ dir): the dir also
        # holds unrelated suites, e.g. test_jev_artifact_verdict.py is broken
        # at collection on main (imports a VerdictValidationError that does
        # not exist in verdict.py) -- out of scope for this job, flagged
        # separately. This job gates exactly the active-retry safety logic.
        run: >-
          python -m pytest
          prismatic/review_factory/tests/test_failure_triage.py
          prismatic/review_factory/tests/test_triage_actions.py
          prismatic/review_factory/tests/test_failure_triage_shadow_driver.py
          -q -p no:cacheprovider

  signal:
    name: "signal (suite minus quarantine — must be green)"
    # WS2 true-green signal. Blocking: the suite minus tests/quarantine.yaml
    # must be 100% green. Self-hosted webtop-hermes runner (free minutes).
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and release dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[release]"

      - name: Run signal suite
        run: python -m pytest tests --quarantine-mode=signal -q -p no:cacheprovider

  review-factory-gate:
    name: "review factory gate (tier A)"
    # Self-hosted webtop-hermes runner — minutes are free. If the runner is
    # ever offline this job waits; the smoke job above still reports.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and release dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[release]"

      - name: "review factory gate (tier A: focused verification)"
        run: python scripts/review_factory_gate.py --base origin/main --tier A

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-factory-receipt-${{ github.run_id }}
          path: rf-gate-logs/
          if-no-files-found: warn
