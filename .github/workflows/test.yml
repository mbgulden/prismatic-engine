name: test

on:
  push:
    branches:
      - main
      - deploy-fresh
  pull_request:
    branches:
      - main
      - deploy-fresh

jobs:
  test:
    name: test py${{ matrix.python-version }} ${{ matrix.test-shard }}
    runs-on: ubuntu-latest
    # Bound the whole job well below the 6h default so a stalled suite fails
    # fast instead of the runner being reclaimed by GitHub infra mid-run.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Split the unit tests across two runners per Python version.
        # Evidence (runs 35485916531, 35482029608): the single unsharded
        # ~2200-test process was killed by runner infra ("The runner has
        # received a shutdown signal") at arbitrary points/times, consistent
        # with host resource reclamation. Sharding halves the per-runner
        # load and isolates a kill to one shard.
        test-shard: ["tests", "review-factory"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and release dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[release]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright & Dependencies
        run: |
          python -m pip install playwright pytest-playwright
          npm ci
          npx playwright install --with-deps chromium

      - name: Run lint
        run: |
          python -m ruff check \
            prismatic/__init__.py \
            prismatic/review_factory/ \
            scripts/release_check.py \
            scripts/release_smoke.py \
            scripts/public_launch_smoke.py \
            scripts/public_security_readiness_audit.py \
            scripts/dashboard_visual_qa.py \
            tests/test_plugin_load_gate.py \
            tests/test_public_security_readiness.py \
            tests/test_dashboard_ux_hardening.py \
            prismatic/quality/test_smoke.py
          python -m ruff format --check \
            prismatic/__init__.py \
            prismatic/review_factory/ \
            scripts/release_check.py \
            scripts/release_smoke.py \
            scripts/public_launch_smoke.py \
            scripts/public_security_readiness_audit.py \
            scripts/dashboard_visual_qa.py \
            tests/test_plugin_load_gate.py \
            tests/test_public_security_readiness.py \
            tests/test_dashboard_ux_hardening.py \
            prismatic/quality/test_smoke.py

      - name: Run distribution readiness smoke (clean-room fresh-install)
        run: |
          python scripts/distribution_readiness_smoke.py --fresh-install

      - name: Run release readiness checks
        run: |
          python scripts/release_check.py

      - name: Run release smoke
        run: |
          python scripts/release_smoke.py

      - name: Run public security audit
        run: |
          python scripts/public_security_readiness_audit.py

      - name: Validate documentation and OKF governance
        run: |
          python scripts/validate_okf_docs.py

      # Resource snapshot before the suite: evidence for diagnosing any
      # future runner kills ("shutdown signal") as memory vs disk.
      - name: Runner resource snapshot (before unit tests)
        run: |
          echo "--- df -h ---"
          df -h
          echo "--- free -m ---"
          free -m
          echo "--- nproc ---"
          nproc

      - name: Run Unit Tests (${{ matrix.test-shard }})
        # A hung shard fails with a clear timeout instead of the runner
        # being reclaimed after indefinite silence. The unsharded suite
        # was heading for ~40+ min (35% in ~14.5 min on run 35485916531).
        timeout-minutes: 45
        run: |
          if [ "${{ matrix.test-shard }}" = "tests" ]; then
            python -m pytest tests/
          else
            python -m pytest prismatic/review_factory/tests/
          fi

      - name: Runner resource snapshot (after unit tests)
        if: always()
        run: |
          echo "--- df -h ---"
          df -h
          echo "--- free -m ---"
          free -m

      - name: Setup Mock Git Hooks (Required by Canary Integration Tests)
        run: |
          mkdir -p .git/hooks
          touch .git/hooks/pre-commit .git/hooks/pre-push
          chmod +x .git/hooks/pre-commit .git/hooks/pre-push

      - name: Run Sandbox Integration Tests (Canary)
        env:
          PRISMATIC_HOME: ${{ github.workspace }}
        run: |
          bash scripts/canary_test.sh --verbose

  build:
    name: build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[release]"

      - name: Build distributions
        run: |
          rm -rf dist build *.egg-info
          python -m build
          python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prismatic-engine-dist
          path: dist/*
          if-no-files-found: error
