name: test

# PR gate: fast smoke on GitHub-hosted (~2 min) + the review factory
# verifier on the self-hosted webtop-hermes runner (free minutes).
#
# What changed (Sep 2026): the old 8-job matrix (4 Python versions x 2 shards,
# up to 70 min/run, fired on both push AND pull_request) burned ~1,840 of
# 2,000 monthly minutes. The full unit suite now runs nightly on the
# self-hosted runner instead (nightly-full-suite.yml); PRs get the focused
# review-factory gate plus a ruff smoke check.
#
# DO NOT re-add push+pull_request double triggers or the version matrix here
# without checking the Actions minute budget first.

on:
  pull_request:
    branches:
      - main
      - deploy-fresh
  push:
    branches:
      - main
      - deploy-fresh

# A new push kills the stale run instead of billing both.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (ruff lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run lint
        run: |
          python -m ruff check \
            prismatic/__init__.py \
            prismatic/review_factory/ \
            scripts/release_check.py \
            scripts/release_smoke.py \
            scripts/public_launch_smoke.py \
            scripts/public_security_readiness_audit.py \
            scripts/dashboard_visual_qa.py \
            tests/test_plugin_load_gate.py \
            tests/test_public_security_readiness.py \
            tests/test_dashboard_ux_hardening.py \
            prismatic/quality/test_smoke.py
          python -m ruff format --check \
            prismatic/__init__.py \
            prismatic/review_factory/ \
            scripts/release_check.py \
            scripts/release_smoke.py \
            scripts/public_launch_smoke.py \
            scripts/public_security_readiness_audit.py \
            scripts/dashboard_visual_qa.py \
            tests/test_plugin_load_gate.py \
            tests/test_public_security_readiness.py \
            tests/test_dashboard_ux_hardening.py \
            prismatic/quality/test_smoke.py

  review-factory-gate:
    name: "review factory gate (tier A)"
    # Self-hosted webtop-hermes runner — minutes are free. If the runner is
    # ever offline this job waits; the smoke job above still reports.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and release dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[release]"

      - name: "review factory gate (tier A: focused verification)"
        run: python scripts/review_factory_gate.py --base origin/main --tier A

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-factory-receipt-${{ github.run_id }}
          path: rf-gate-logs/
          if-no-files-found: warn
