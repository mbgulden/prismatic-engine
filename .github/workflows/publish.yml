name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish to PyPI instead of dry-run build only"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-publish:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[release]"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          TAG="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG" || {
            echo "Tag v$TAG does not match pyproject version $VERSION" >&2
            exit 1
          }

      - name: Run release readiness checks
        run: |
          python scripts/release_check.py
          python scripts/release_smoke.py
          python scripts/public_security_readiness_audit.py

      - name: Build package distributions
        run: |
          rm -rf dist build *.egg-info
          python -m build
          python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prismatic-engine-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Publish package to PyPI
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi == 'true')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: false
