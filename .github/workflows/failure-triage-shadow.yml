name: Failure Triage (Shadow)

# Shadow-mode failure triage (roadmap chunk 5): observes CI and deploy
# failures, classifies them with deterministic rules first (known-transient
# list, flaky-test statistics), asks Jev only for what the rules can't
# classify — and then IGNORES the advice. One shadow audit signal per
# failure, uploaded as an artifact. NEVER dispatches repairs, NEVER retries
# jobs, NEVER rejects candidates, NEVER pages.
#
# Event-based: driven by workflow_run completion events on the self-hosted
# runner, not polling. workflow_dispatch with a run_id input is the manual
# backstop (no cron schedule ships with this chunk).
#
# Default-off: without SWARMJEV_ENABLED and
# SWARMJEV_CALLSITE_FAILURE_TRIAGE_ENABLED both set, the Jev call site
# stays closed and triage is deterministic-rules-only — zero Jev calls.
#
# Self-trigger guard: the workflows filter below names only the CI and
# deploy workflows, so this workflow's own completion can never retrigger it.

on:
  workflow_run:
    workflows:
      - "test"
      - "Post-Merge Production Deploy Hook (WB-1)"
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run ID to triage manually (backstop)"
        required: false
        default: ""

# Least privilege: read the run's jobs via the API. Without actions:read
# the jobs fetch 403s and the workflow can never succeed (Sep 22, 2026).
permissions:
  contents: read
  actions: read

jobs:
  triage-shadow:
    name: shadow triage
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    # Failures only. Success/cancelled runs are ignored.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Run shadow triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # R-1 Phase 1b: retry-only active mode. Seven-day audit soak begins on merge.
          # execute_retry is idempotent (per-run dedup store), deterministic-verdict retries only;
          # JEV-advised retries stay shadow. To stop: revert this block; no other change needed.
          PRISMATIC_TRIAGE_RETRY_ENABLED: "1"
        run: python scripts/failure_triage_shadow.py --mode active --audit-log failure-triage-shadow.jsonl

      - name: Upload shadow audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-triage-shadow-${{ github.run_id }}
          path: failure-triage-shadow.jsonl
          if-no-files-found: warn
