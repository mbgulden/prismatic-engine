name: Plugin Load Gate

# Runs Gap 13's ship-time plugin load verification on every PR that
# touches plugins/ or prismatic/core/registry.py. Fails the build if
# any shipped plugin doesn't load in the current environment.
#
# pyproject.toml and prismatic/__init__.py are in the path filter so a
# version-bump PR cannot skip the conformance check: the plugin<->engine
# compatibility contract (docs/contracts/plugin-engine-compat-contract.md)
# is versioned against the engine package version.

on:
  pull_request:
    paths:
      - "plugins/**"
      - "prismatic/shipped_plugins/**"
      - "prismatic/core/registry.py"
      - "prismatic/plugin_architecture.py"
      - "prismatic/plugin_policy.py"
      - "prismatic/quality/plugin_load.py"
      - "tests/test_plugin_load_gate.py"
      - "pyproject.toml"
      - "prismatic/__init__.py"
  push:
    branches:
      - deploy-fresh
      - main
    paths:
      - "plugins/**"
      - "prismatic/shipped_plugins/**"
      - "prismatic/core/registry.py"
      - "prismatic/plugin_architecture.py"
      - "prismatic/plugin_policy.py"
      - "prismatic/quality/plugin_load.py"
      - "tests/test_plugin_load_gate.py"
      - "pyproject.toml"
      - "prismatic/__init__.py"

# A new push kills the stale run instead of billing both.
concurrency:
  group: plugin-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-plugins-load:
    name: Verify shipped plugins load
    # Self-hosted webtop-hermes runner (free minutes; GitHub-hosted
    # minutes are blocked by the account billing state).
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install prismatic engine + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Run plugin load gate
        run: |
          python -m prismatic.quality.plugin_load

      - name: Run gate unit tests
        run: |
          python -m pytest tests/test_plugin_load_gate.py -v
